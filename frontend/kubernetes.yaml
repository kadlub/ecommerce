apiVersion: v1
kind: Namespace
metadata:
  name: musify

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: database
  namespace: musify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
    spec:
      containers:
      - name: database
        image: 654654313356.dkr.ecr.eu-north-1.amazonaws.com/musify:postgres-latest
        ports:
        - containerPort: 5432
        env:
        - name: POSTGRES_USER
          value: postgres
        - name: POSTGRES_PASSWORD
          value: Dudzio1423
        - name: POSTGRES_DB
          value: musify

---

apiVersion: v1
kind: Service
metadata:
  name: database
  namespace: musify
spec:
  selector:
    app: database
  ports:
  - protocol: TCP
    port: 5432
    targetPort: 5432
  type: ClusterIP

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: userservice
  namespace: musify
spec:
  replicas: 1
  selector:
    matchLabels:
      app: userservice
  template:
    metadata:
      labels:
        app: userservice
    spec:
      containers:
      - name: userservice
        image: 654654313356.dkr.ecr.eu-north-1.amazonaws.com/musify:userservice-latest
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_DATASOURCE_URL
          value: "jdbc:postgresql://database.musify.svc.cluster.local:5432/musify"
        - name: SPRING_DATASOURCE_USERNAME
          value: "postgres"
        - name: SPRING_DATASOURCE_PASSWORD
          value: "Dudzio1423"

---

apiVersion: v1
kind: Service
