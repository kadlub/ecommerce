version: '3.9'

services:
  userservice:
    build:
      context: ./userService
    ports:
      - "8081:8081"
    networks:
      - app-network

  productservice:
    build:
      context: ./productService
    ports:
      - "8082:8082"
    networks:
      - app-network

  orderservice:
    build:
      context: ./orderService
    ports:
      - "8083:8083"
    networks:
      - app-network

  reviewservice:
    build:
      context: ./reviewService
    ports:
      - "8084:8084"
    networks:
      - app-network

  api_gateway:
    build:
      context: ./api_gateway
    ports:
      - "8080:8080"
    environment:
      # Przekazywanie zmiennych środowiskowych do konfiguracji tras
      PRODUCT_SERVICE_URI: http://productservice:8082
      USER_SERVICE_URI: http://userservice:8081
      ORDER_SERVICE_URI: http://orderservice:8083
      REVIEW_SERVICE_URI: http://reviewservice:8084

      # Konfiguracja CORS
      #SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_["/**"].ALLOWED_ORIGINS: http://localhost:3000
      #SPRING_CLOUD_GATEWAY_GLOBALCORS_CORS_CONFIGURATIONS_["/**"].ALLOWED_METHODS: GET,POST,PUT,DELETE,OPTIONS
    depends_on:
      - userservice
      - productservice
      - orderservice
      - reviewservice
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
