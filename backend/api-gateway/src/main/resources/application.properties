# Ustawienia aplikacji
spring.application.name=api-gateway
server.port=8080

# Routing w API Gateway
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=http://user-service:8081
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/users/**

spring.cloud.gateway.routes[1].id=product-service
spring.cloud.gateway.routes[1].uri=http://product-service:8082
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.routes[2].id=order-service
spring.cloud.gateway.routes[2].uri=http://order-service:8083
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.routes[3].id=review-service
spring.cloud.gateway.routes[3].uri=http://review-service:8084
spring.cloud.gateway.routes[3].predicates[0]=Path=/api/reviews/**

# Opcjonalnie: logowanie requestów
logging.level.org.springframework.cloud.gateway=DEBUG

# Ustawienia kodowania
server.tomcat.uri-encoding=UTF-8
spring.web.encoding.charset=UTF-8
spring.web.encoding.enabled=true
spring.web.encoding.force=true
