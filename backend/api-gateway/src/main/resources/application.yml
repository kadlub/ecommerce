server:
  port: 8080

spring:
  application:
    name: api-gateway
  main:
    web-application-type: reactive
  security:
    basic:
      enabled: false
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://user-service:8081
          predicates:
            - Path=/api/users/**
          filters:
            - AddRequestHeader=X-Forwarded-Authorization, #{auth_token}
        - id: product-service
          uri: http://product-service:8082
          predicates:
            - Path=/api/products/**
          filters:
            - AddRequestHeader=X-Forwarded-Authorization, #{auth_token}
        - id: order-service
          uri: http://order-service:8083
          predicates:
            - Path=/api/orders/**
          filters:
            - AddRequestHeader=X-Forwarded-Authorization, #{auth_token}
        - id: review-service
          uri: http://review-service:8084
          predicates:
            - Path=/api/reviews/**
          filters:
            - AddRequestHeader=X-Forwarded-Authorization, #{auth_token}
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - HEAD

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
